<!doctype html>
<html lang="pt-BR" translate="no">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- lang errado (en) + tradução automática do navegador reescrevendo o
         DOM foi a causa real da unidade fantasma "Compras em Ribeirão" (era
         "Ribeirão Shopping" traduzido) e do crash NotFoundError ao clicar —
         o Google Translate mexe nos nós de texto por baixo do React, que
         depois tenta atualizar/remover um nó que não é mais o que ele
         esperava. notranslate + lang correto impede o navegador de oferecer
         tradução nessa página. -->
    <meta name="google" content="notranslate" />
    <title>Sistemas Buddha Spa CRM</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7c0202" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
